[project]
name = "mlzc-module5"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.1",
    "numpy==2.5.3",
    "pandas==3.0.6",
    "scikit-learn==1.9.1",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "requests==2.34.2",
]

[project.scripts]
mlzc-module5 = "mlzc_module5:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.uv]
python-preference = "system"
default-groups = "all"
cache-dir = "/mnt/d/uv/cache"
